services:
  db:
    image: postgres:16-alpine
    container_name: elevare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elevare-auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 'elevare-auction'"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: elevare-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/elevare-auction?sslmode=disable",
        "up",
      ]
    restart: "no"

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: elevare-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ADDR: :8080    
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: elevare-worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["/app/worker"]
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: elevare-web
    working_dir: /app
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_API_PORT: 8080
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8080
      NEXT_PUBLIC_WS_PORT: 8080
      API_BASE_URL: http://api:8080
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_SITE_PREVIEW_TOKEN: ${SITE_PREVIEW_TOKEN:-dev-site-preview-token}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: sh -lc "npm install && npm run dev"
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
