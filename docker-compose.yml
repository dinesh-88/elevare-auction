services:
  db:
    image: postgres:16-alpine
    container_name: elevare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elevare-auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 'elevare-auction'"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: elevare-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/elevare-auction?sslmode=disable",
        "up",
      ]
    restart: "no"

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: elevare-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/elevare-auction?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
