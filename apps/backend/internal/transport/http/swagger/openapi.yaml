openapi: 3.0.3
info:
  title: Elevare Auction SaaS API
  version: 0.1.0
  description: Multi-tenant auction backend MVP API.
servers:
  - url: http://localhost:8080
paths:
  /signup:
    post:
      summary: Public tenant signup request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_name, desired_subdomain, admin_email, password, country]
              properties:
                organization_name:
                  type: string
                desired_subdomain:
                  type: string
                admin_email:
                  type: string
                password:
                  type: string
                country:
                  type: string
                estimated_auction_volume:
                  type: integer
      responses:
        '201':
          description: Created
  /platform/admin/tenants:
    get:
      summary: List tenant onboarding requests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACTIVE, REJECTED]
      responses:
        '200':
          description: OK
  /platform/admin/tenants/{id}/approve:
    patch:
      summary: Approve tenant and admin user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /platform/admin/tenants/{id}/reject:
    patch:
      summary: Reject tenant and admin user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /public/config:
    get:
      summary: Get tenant public branding config
      responses:
        '200':
          description: OK
  /auctions:
    get:
      summary: List public auctions
      responses:
        '200':
          description: OK
  /auctions/{id}:
    get:
      summary: Get auction details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register bidder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
  /auth/verify-email:
    post:
      summary: Mark user email as verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
  /auctions/{id}/bid:
    post:
      summary: Place bid
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
      responses:
        '201':
          description: Created
  /admin/auctions:
    get:
      summary: List all auctions (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Create auction (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /admin/auctions/{id}:
    patch:
      summary: Update auction (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    delete:
      summary: Delete auction (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/auctions/{id}/start:
    patch:
      summary: Start auction (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/auctions/{id}/pause:
    patch:
      summary: Pause auction (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/auctions/{id}/end:
    patch:
      summary: End auction (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/bidders:
    get:
      summary: List bidders (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /admin/bidders/{id}/approve:
    patch:
      summary: Approve bidder (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
